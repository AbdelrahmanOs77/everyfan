# EveryFan match intelligence: every formula weight and threshold (Owner B).
# Published in docs/OWNER_B.md so judges can check every number on screen.
# Calibrated on the demo match (match_001): Nile PPDA 5.3 / 1.7 / 2.2 and possession 38% / 70% / 45%
# in the 18-36', 54-67' and 80-90' windows reproduce the measured table in docs/OWNER_A.md exactly.

version: analytics_v1

pitch:
  length_m: 105.0
  width_m: 68.0
  box_depth_m: 16.5          # penalty area depth
  box_half_width_m: 20.16    # penalty area is 40.32 m wide, centred on y = 34
  final_third_m: 35.0        # attacking third = last 35 m before the opponent's goal

rolling_window_s: 300        # "last 5 minutes" for every rolling metric

advanced_features:
  formation_window_s: 60
  position_groups: {GK: GK, RB: FB, LB: FB, CB: CB, DM: MID, CM: MID, AM: AM, RW: W, LW: W, ST: ST}
  benchmark_metrics:
    outfield: [passes_completed, pass_accuracy_pct, distance_km, high_intensity_m, top_speed_kmh]
    FB: [tackles_won, interceptions, duel_win_pct, recoveries]
    CB: [tackles_won, interceptions, duel_win_pct, recoveries]
    MID: [key_passes, forward_passes_10m, final_third_entries]
    AM: [key_passes, forward_passes_10m, final_third_entries]
    W: [shots, shots_on_target, box_entries, sprints]
    ST: [shots, shots_on_target, box_entries, sprints]
    GK: [saves, pass_accuracy_pct, distance_km]
  benchmark_rates: [pass_accuracy_pct, duel_win_pct, top_speed_kmh]
  lower_is_better: []
  role_weights:
    GK: {saves: 3, pass_accuracy_pct: 2, distance_km: 1}
    FB: {tackles_won: 2, interceptions: 2, passes_completed: 2, high_intensity_m: 1}
    CB: {interceptions: 3, tackles_won: 2, duel_win_pct: 2, pass_accuracy_pct: 2, recoveries: 1}
    MID: {key_passes: 3, passes_completed: 2, forward_passes_10m: 2, pass_accuracy_pct: 1}
    AM: {key_passes: 3, final_third_entries: 2, passes_completed: 1}
    W: {shots_on_target: 3, shots: 2, box_entries: 2, sprints: 1, passes_completed: 1}
    ST: {shots_on_target: 3, shots: 2, box_entries: 2, sprints: 1, passes_completed: 1}
  phase_min_frames: 20
  formation_four_line_margin: 0.25
  formation_min_spread_m: 1.0
  stable_formation_s: 180
  history_step_s: 30
  links_window_s: 300
  max_links: 8
  grid_step_m: 1.0
  event_frame_tolerance_s: 0.5
  line_break_players: 3
  counter_window_s: 15
  fast_break_s: 10
  pressing_columns: 6
  pressing_rows: 4
  heatmap_columns: 21
  heatmap_rows: 14
  trail_s: 60
  output_block_s: 900
  benchmark_min_minutes: 15
  reference_min_minutes: 30
  off_ball_distance_m: 5
  off_ball_speed_kmh: 18
  off_ball_gain_m: 10
  received_pass_s: 3
  forward_pass_m: 10

metrics:
  pass_difficulty:           # 0-1 heuristic, not xPass
    w_distance: 0.35
    distance_norm_m: 40
    w_pressure: 0.35
    w_forward: 0.20
    forward_norm_m: 30
    w_final_third: 0.10
  player_speed:
    frame_dt_s: 0.5          # tracking is 2 Hz
    smoothing_frames: 3      # moving average of instantaneous speeds
  team_shape:
    defensive_line_players: 4  # deepest outfield players, measured from own goal
  high_intensity:
    distance_threshold_kmh: 19.8  # strictly greater, using existing smoothed speeds
    sprint_threshold_kmh: 25.2    # strictly greater
    sprint_min_duration_s: 1.0    # strictly longer; count once at qualification
  possession:
    # Time is credited to the team in possession since the last possession_change / kickoff.
    method: time_since_possession_change
  control_index:             # 0-100, per team
    w_pass_accuracy: 0.4
    w_passes_per_possession: 0.3
    passes_per_possession_norm: 8
    w_possession: 0.3
  chaos_index:               # 0-100, whole match
    w_turnovers: 0.4
    turnovers_per_min_norm: 6        # plan started at 3; 3.8/min is this simulator's average, so 3 saturated
    w_short_possessions: 0.4
    short_possession_max_passes: 2
    w_duels_fouls: 0.2
    duels_fouls_per_min_norm: 2
  rhythm:
    # label from passes per minute (both teams) in the rolling window
    slow_below_passes_per_min: 9.5
    frantic_above_passes_per_min: 15.0
  ppda:                      # opponent passes in their own 60% / our tackles + interceptions + fouls there
    zone_share: 0.6
    defensive_actions: [tackle, interception, foul]
  momentum:
    decay_s: 120             # weight e^(-dt / 120 s)
    weights:
      shot: 3
      box_entry: 2
      final_third_pass: 1
      corner: 1

badges:
  sprint_kmh: 30             # smoothed top speed above 30 km/h -> "Sprint"
  rocket_kmh: 100            # shot above 100 km/h -> "Rocket"
  distance_step_km: 2        # every 2 km covered -> distance badge
  killer_pass_difficulty: 0.75

moments:
  cooldown_s: 90             # same moment type at most once per 90 match-seconds (goals and red cards exempt)
  min_importance_for_agents: 0.5   # below this, moments are template-only player tags
  min_clock_s: 300           # rolling-window rules wait for a full window
  goal:
    importance: 1.0
  red_card:
    importance: 0.9
  big_chance:
    # Unblocked shot from inside the box, close range, under low pressure; or an on-target rocket.
    # Plan started at pressure < 0.4; the scripted 86:07 chance is a saved 12 m shot under 0.48.
    importance: 0.8
    max_pressure_in_box: 0.5
    max_distance_m: 13
    on_target_speed_kmh: 100
  momentum_shift:
    importance: 0.7
    min_gap: 8.0             # plan started at 3; one shot + one box entry is already 5 on this scale
  pressing_shift:
    importance: 0.7
    ratio: 0.6               # PPDA last 5 min < 0.6 x match PPDA
    rearm_ratio: 0.8         # must recover above 0.8 x match PPDA before it can fire again
    min_clock_s: 900         # match PPDA needs a baseline first
    min_defensive_actions: 5
    hold_s: 60               # condition must hold for a minute (filters one-off blips)
  control_to_chaos:
    importance: 0.6
    threshold: 65            # plan started at 60; this simulator averages ~55
    rearm_below: 50
  rhythm_change:
    importance: 0.5
    hold_s: 120              # new label must hold for 2 minutes
  killer_pass:
    importance: 0.6
    shot_within_s: 10
  player_milestone:
    importance: 0.4
